version: "3.9"

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - WEB_CONCURRENCY=1
      - MAX_CONCURRENT_DOWNLOADS=4
      - ALLOWED_ORIGINS=["https://your-domain.com"]
      - RATE_LIMIT=20/minute
    volumes:
      - downloads_tmp:/srv/app/downloads_tmp
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs:/etc/nginx/certs:ro   # mount your TLS certs for HTTPS

volumes:
  downloads_tmp:
